# 连接数限制的共享内存区（APK 限速用）
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 主域名 - HTTPS（静态站点，含门户首页 + 博客 + Lingo）
server {
    server_name duwenjie.site;

    root /var/www/portal;
    index index.html;

    access_log /var/log/nginx/duwenjie_access.log;
    error_log  /var/log/nginx/duwenjie_error.log;

    # APK 本地兜底下载：限速保护，避免占用过多出口带宽（主力下载走 OSS）
    location ~* \.apk$ {
        limit_rate 300k;
        limit_conn perip 2;
        add_header Cache-Control "public, max-age=86400";
    }

    # 静态资源长缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/duwenjie.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/duwenjie.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www - HTTPS，301重定向到主域名
server {
    server_name www.duwenjie.site;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.duwenjie.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.duwenjie.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot

    return 301 https://duwenjie.site$request_uri;
}

# HTTP - 跳转HTTPS
server {
    listen 80;
    server_name duwenjie.site www.duwenjie.site;
    return 301 https://$host$request_uri;
}
